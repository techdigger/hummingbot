name: TheHub Connector CI

on:
  push:
    branches:
      - feature/thehub-connector-phase2
    paths:
      - hummingbot/connector/exchange/thehub/**
      - test/hummingbot/connector/exchange/thehub/**
      - .github/workflows/thehub-connector-ci.yml
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - hummingbot/connector/exchange/thehub/**
      - test/hummingbot/connector/exchange/thehub/**
      - .github/workflows/thehub-connector-ci.yml

jobs:
  lint-and-test:
    name: Lint + Test (TheHub connector)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Hummingbot conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: setup/environment.yml
          environment-name: hummingbot
          cache-environment: true
          cache-downloads: true
          cache-environment-key: env-${{ hashFiles('setup/environment.yml') }}

      - name: Compile Cython extensions
        env:
          WITHOUT_CYTHON_OPTIMIZATIONS: "true"
        run: python setup.py build_ext --inplace --quiet 2>&1 | tail -5

      - name: Lint — ruff
        run: |
          ruff check \
            hummingbot/connector/exchange/thehub/ \
            test/hummingbot/connector/exchange/thehub/

      - name: Test — TheHub connector
        run: |
          pytest test/hummingbot/connector/exchange/thehub/ \
            -v \
            --tb=short \
            --no-header

      - name: Verify no derivatives/perps files changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E \
              '^(hummingbot/connector/derivative/|test/hummingbot/connector/derivative/|hummingbot/connector/exchange/.*perpetual|test/hummingbot/connector/exchange/.*perpetual)' \
            || true)
          if [ -n "$changed" ]; then
            echo "ERROR: derivative/perps files changed unexpectedly:"
            echo "$changed"
            exit 1
          fi
          echo "OK: no derivative/perps files changed"
